
name: Aetherfall Android APK Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Aetherfall Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify Project Files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle.properties
          test -f gradle/libs.versions.toml
          test -f app/src/main/AndroidManifest.xml

          echo "Project structure verified."

      - name: Verify Build Environment
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Run Unit Tests
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK Output
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Aetherfall-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Signing
        id: release-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/aetherfall-upload.jks
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$STORE_PASSWORD" ||
                -z "$KEY_PASSWORD" ]]; then

            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Release AAB
        if: steps.release-signing.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/aetherfall-upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:bundleRelease

      - name: Upload Release AAB
        if: steps.release-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Aetherfall-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Aetherfall-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
