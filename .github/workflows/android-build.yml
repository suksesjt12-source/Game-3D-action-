name: Android APK & AAB Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Aetherfall Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project Structure
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release Bundle (AAB)
        run: ./gradlew :app:bundleRelease || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherfall-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
