
name: Aetherfall Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:

    name: Build Aetherfall APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.1.0'

      - name: Verify Project Structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/libs.versions.toml

          echo "Project structure verified."

      - name: Print Build Environment
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Run Unit Tests
        run: |
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully created."
          ls -lh "$APK"

      - name: Prepare Release Signing
        id: release-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ||
                -z "$STORE_PASSWORD" ||
                -z "$KEY_PASSWORD" ]]; then

            echo "ready=false" >> "$GITHUB_OUTPUT"

            echo "::notice::Release signing not configured. AAB build skipped."

            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/my-upload-key.jks"

          test -s "$RUNNER_TEMP/my-upload-key.jks"

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Release AAB
        if: steps.release-signing.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            :app:bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Aetherfall-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB
        if: steps.release-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Aetherfall-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
